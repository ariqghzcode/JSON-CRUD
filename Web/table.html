<!DOCTYPE html>

<html lang="en">
<style>
    body {
        border-radius: 5px;
        background-color: #eff8ff;
        padding: 20px;
    }

    input[type=button] {
        width: 100%;
        background-color: #390dea;
        color: white;
        padding: 14px;
        margin: 2px 0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    input[type=button]:hover {
        background-color: #2f0bc0;
    }

    table {
        font-family: "Times New Roman", Helvetica, sans-serif;
        border: 2px solid #f2f2f2;
        border-collapse: collapse;
        width: 100%;
        margin-top: 10px;
    }

    td,
    th {
        border: none;
        padding: 8px;
    }

    tr:nth-child(odd) {
        background-color: #f2f2f2;
    }

    tr:hover {
        background-color: #ddd;
    }

    th {
        text-align: left;
        background-color: #eff8ff;
    }
</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <h1>JSON CRUD (Create, Read, Update, Delete)</h1>
    <input type="button" value="Create" onclick="window.location.href='/add'"><br>

    <table>
        <thead>
            <tr>
                <th>No.</th>
                <th>Name</th>
                <th>Height</th>
                <th>Weight</th>
                <th>Birth Date</th>
                <th>Is Married</th>
                <th>actions</th>
            </tr>
        </thead>
        <tbody>
           {{table_body}} 
        </tbody>
    </table>
</body>

</html>
